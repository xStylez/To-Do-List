<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/style.css">
  </head>
  <body>

    <div class="page">

      <div class="app">
        <div class="app-header">
          <img class="todo-logo" src="/app/images/todo-logo.png">
        </div>

        <div class="app-body">
          <aside class="sidebar">
            <nav>
              <ul class="sidebar-nav">
                <li><button type="button" class="nav-link is-active" data-filter="Home">Home</button></li>
                <li><button type="button" class="nav-link" data-filter="Today">Today</button></li>
                <li><button type="button" class="nav-link" data-filter="Week">Week</button></li>
                <li class="nav-label">Projects</li>
                <li><button type="button" class="nav-link">Notes</button></li>
              </ul>
              <button type="button" class="add-button">+</button>
            </nav>

          </aside>

          <!-- Modal (Add To Do , Project, Notes) -->
           <div class="modal-overlay is-hidden" id="create-modal">
            <div class="modal">
              <header class="modal-header">
                <h2 class="modal-title">Create a new...</h2>
                <button type="button" class="modal-close" aria-label="Close">×</button>
              </header>
              <div class="modal-body">
                <aside class="modal-nav">
                  <button type="button" class="modal-tab is-active" data-panel="todo">To Do</button>
                  <button type="button" class="modal-tab" data-panel="project">Project</button>
                  <button type="button" class="modal-tab" data-panel="note">Note</button>
                </aside>

                <div class="modal-panels">
                  <section class="modal-panel" data-panel="todo">To Do in development...</section>
                  <section class="modal-panel is-hidden" data-panel="project">Projects in development...</section>
                  <section class="modal-panel is-hidden" data-panel="note">Notes in development...</section>
                </div>
              </div>
            </div>
           </div>

          <main class="todo-panel">

            <div class="list-sort">
              <label class="sort-label"for="sort-select">Sort by:</label>
              <select id="sort-select">
                <option value="date">Date</option>
                <option value="priority">Priority</option>
                <option value="newest">Newest</option>
              </select>
            </div>
            <form id="todo-form" class="todo-form is-hidden">
                <input id="title" type="text" placeholder="Title" required>
                <input id="details" type="text" placeholder="Details">
                <input id="due_date" type="date">
                <select id="priority" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button type="submit">Add</button>
            </form>
            <ul id="todo-list"></ul>
          </main>

        </div>
      </div>
    </div>

    <script src="/app/main.js"></script>
  </body>
</html>
