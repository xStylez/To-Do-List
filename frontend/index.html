<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/style.css">
  </head>
  <body>

    <div class="page">

      <div class="app">
        <div class="app-header">
          <img class="todo-logo" src="/app/images/todo-logo.png">
        </div>

        <div class="app-body">
          <aside class="sidebar">
            <nav>
              <ul class="sidebar-nav">
                <li><button type="button" class="nav-link is-active" data-filter="Home">Home</button></li>
                <li><button type="button" class="nav-link" data-filter="Today">Today</button></li>
                <li><button type="button" class="nav-link" data-filter="Week">Week</button></li>
                <li><button type="button" class="nav-link nav-label" id="projects-label">Projects</button></li>
                <li>
                  <ul class="projects-list"></ul>
                </li>
                <li><button type="button" class="nav-link" id="notes-link">Notes</button></li>
              </ul>
              <button type="button" class="add-button">+</button>
            </nav>

          </aside>

          <!-- Details Modal -->
          <div class="modal-overlay is-hidden" id="details-modal">
            <div class="modal-details">
              <header class="modal-header">
                <h2 class="modal-title">To-Do Details</h2>
                <button type="button" class="modal-close" id="close-details-modal" aria-label="Close">×</button>
              </header>
              <div class="details-body">
                <h3> <span id="details-title"></span></h3>
                <p>Project: <span id="details-project"></span></p>
                <p>Details: <span id="details-details"></span></p>
                <p>Due Date: <span id="details-due-date"></span></p>
                <p>Priority: <span id="details-priority"></span></p>
              </div>
            </div>
          </div>


          <!-- Modal Edit to do -->
          <div class="modal-overlay is-hidden" id="edit-modal">
            <div class="modal">
              <header class="modal-header">
                <h2 class="modal-title">Edit To-Do</h2>
                <button type="button" class="modal-close" id="close-edit-modal" aria-label="Close">×</button>
              </header>
              <div class="modal-body">
                <div class="modal-panels">
                  <section class="modal-panel" data-panel="todo">
                    <!-- To Do Modal Panel -->
                    <form id="edit-form" class="todo-form">
                      <input id="edit-title" type="text" class="todo-form-title-input" " required>
                      <textarea id="edit-details" type="text" class="todo-form-details-input" maxlength="350""></textarea>
                      <div class="todo-form-row-date">
                        <label for="due_date">Due Date:</label>
                        <input id="edit-due_date" type="date" class="todo-form-due-date-input">
                      </div>
                      <div class="todo-form-row-priority">
                        <span>Priority:</span>
                            <button type="button" class="priority-choice is-selected priority-choice-low" data-priority="low">Low</button>
                            <button type="button" class="priority-choice priority-choice-medium" data-priority="medium">Medium</button>
                            <button type="button" class="priority-choice priority-choice-high" data-priority="high">High</button>
                            <button type="submit" class="todo-form-add-button">Update</button>
                      </div>
                    </form>
                  </section>
                </div>
              </div>
            </div>
           </div>

          <!-- Success Modal -->
           <div class="success-overlay is-hidden" id="success-modal">
            <div class="success-card">
              <div class="success-check">✓</div>
              <h2>Success!</h2>
              <p id="success-message">Todo updated.</p>
            </div>
          </div>

          <!-- Modal (Add To Do , Project, Notes) -->
           <div class="modal-overlay is-hidden" id="create-modal">
            <div class="modal">
              <header class="modal-header">
                <h2 class="modal-title">Create a new...</h2>
                <button type="button" class="modal-close" id="close-create-modal" aria-label="Close">×</button>
              </header>
              <div class="modal-body">
                <aside class="modal-nav">
                  <button type="button" class="modal-tab is-active" data-panel="todo">To Do</button>
                  <button type="button" class="modal-tab" data-panel="project">Project</button>
                  <button type="button" class="modal-tab" data-panel="note">Note</button>
                </aside>            

                <div class="modal-panels">
                  <section class="modal-panel" data-panel="todo">
                    <!-- To Do Modal Panel -->
                    <form id="todo-form" class="todo-form">
                      <input id="title" type="text" class="todo-form-title-input" placeholder="Title: 'Shopping'" required>
                      <textarea id="details" type="text" class="todo-form-details-input" maxlength="350" placeholder="Details. eg. water bill, electricity bill, etc."></textarea>
                      <div class="todo-form-row-date">
                        <label for="due_date">Due Date:</label>
                        <input id="due_date" type="date" class="todo-form-due-date-input">
                      </div>
                      <div class="todo-form-row-priority">
                        <span>Priority:</span>
                            <button type="button" class="priority-choice is-selected priority-choice-low" data-priority="low">Low</button>
                            <button type="button" class="priority-choice priority-choice-medium" data-priority="medium">Medium</button>
                            <button type="button" class="priority-choice priority-choice-high" data-priority="high">High</button>
                            <button type="submit" class="todo-form-add-button">Add to List</button>
                      </div>
                  </form>
                  </section>

                  <!-- Project Modal Panel -->
                  <section class="modal-panel is-hidden" data-panel="project">
                     <form id="project-form" class="project-form">
                        <input id="project-name" type="text" class="project-form-name-input" maxlength="15" placeholder="Project Name: e.g 'Shopping / Bills / etc.'" required>
                        <button type="submit" class="project-form-add-button">Create Project</button>
                    </form>
                  </section>

                  <section class="modal-panel is-hidden" data-panel="note">
                    <form id="notes-form" class="notes-form">
                      <input id="notes-title" type="text" class="notes-form-title-input" placeholder="Title: 'a title for your note'" required>
                      <textarea id="notes-details" type="text" class="notes-form-details-input" maxlength="300" placeholder="Details. eg. anything more specific about your note"></textarea>
                      <button type="submit" class="notes-form-add-button">Create Note</button>
                    </form>
                  </section>
                </div>
              </div>
            </div>
           </div>

          <main class="todo-panel">

            <div class="list-sort">
              <button type="button" class="delete-project-button is-hidden" id="delete-project">Delete Project</button>
              <label class="sort-label"for="sort-select">Sort by:</label>
              <select id="sort-select">
                <option value="date">Date</option>
                <option value="priority">Priority</option>
                <option value="newest">Newest</option>
              </select>
            </div>

            <div id="empty-project" class="empty-project is-hidden">
              <h2>Empty Project!</h2>
              <p>Create a to-do to get started.</p>
              <button type="button" id="delete-empty-project" class="delete-empty-button">Delete Project</button>
            </div>
            <ul id="todo-list"></ul>
          </main>

        </div>
      </div>
    </div>

    <script src="/app/main.js"></script>
  </body>
</html>
